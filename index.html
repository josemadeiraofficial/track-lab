<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Lab — JOSEMADEIRA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#050505;color:#e8e8e8;min-height:100vh;background-image:radial-gradient(circle at 20% 20%, rgba(255,45,149,.08), transparent 40%), radial-gradient(circle at 80% 80%, rgba(0,229,255,.06), transparent 40%)}
  header{background:linear-gradient(90deg,#ff2d95 0%,#00e5ff 100%);padding:18px 32px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(255,45,149,.3)}
  header h1{font-size:24px;font-weight:800;letter-spacing:3px;color:#fff;text-shadow:0 0 20px rgba(0,0,0,.5)}
  .container{max-width:1100px;margin:0 auto;padding:32px 20px}
  .hero{background:linear-gradient(135deg,rgba(255,45,149,.15),rgba(0,229,255,.1));border:1px solid rgba(255,45,149,.3);border-radius:20px;padding:28px;margin-bottom:28px;text-align:center}
  .hero h2{font-size:42px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fff,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
  .hero p{color:#aaa;font-size:14px;letter-spacing:1px}
  .upload-area{border:2px dashed #ff2d95;border-radius:18px;padding:48px 20px;text-align:center;background:rgba(255,45,149,.05);margin-bottom:24px;transition:.3s;cursor:pointer}
  .upload-area.dragover{background:rgba(255,45,149,.15);border-color:#00e5ff}
  .upload-area p{color:#aaa;margin-top:8px;font-size:14px}
  input[type=file]{display:none}
  .btn{background:linear-gradient(90deg,#ff2d95,#00e5ff);border:none;color:#fff;padding:14px 32px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:1px}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,45,149,.5)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  textarea{width:100%;min-height:120px;background:#111;border:1px solid #2a2a2a;border-radius:14px;color:#eee;padding:16px;font-size:14px;resize:vertical;margin-bottom:16px;font-family:inherit}
  textarea:focus{outline:none;border-color:#00e5ff;box-shadow:0 0 0 3px rgba(0,229,255,.15)}
  .settings{background:#0d0d0d;border:1px solid #222;border-radius:16px;padding:20px;margin-bottom:24px}
  .settings label{font-size:13px;color:#aaa;display:block;margin-bottom:6px}
  .settings input, .settings select{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;color:#eee;padding:12px;font-size:13px}
  .settings input:focus, .settings select:focus{outline:none;border-color:#ff2d95}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:28px}
  .card{background:#0d0d0d;border:1px solid #222;border-radius:16px;padding:18px;text-align:center;transition:.2s}
  .card:hover{border-color:#00e5ff}
  .card .label{font-size:11px;color:#888;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
  .card .value{font-size:24px;font-weight:800;color:#00e5ff}
  .card .value.warn{color:#ff9f43}
  .card .value.bad{color:#ff2d95}
  .analysis{background:#0d0d0d;border:1px solid #222;border-radius:18px;padding:24px;white-space:pre-wrap;font-size:15px;line-height:1.75;min-height:220px}
  .analysis h3{color:#ff2d95;margin-bottom:14px;font-size:18px;letter-spacing:1px}
  .status{font-size:13px;color:#888;margin-top:12px;text-align:center}
  .row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .row .btn{flex:1;min-width:140px}
  footer{text-align:center;padding:40px;color:#444;font-size:12px;letter-spacing:1px}
  .copy-btn{background:#1a1a1a;border:1px solid #333;color:#aaa;padding:10px 18px;border-radius:10px;font-size:13px;cursor:pointer;margin-top:14px}
  .copy-btn:hover{color:#fff;border-color:#00e5ff}
</style>
</head>
<body>
<header>
  <h1>TRACK LAB</h1>
  <span style="font-size:13px;opacity:.9;letter-spacing:1px">JOSEMADEIRA · GROK</span>
</header>
<div class="container">
  <div class="hero">
    <h2>READY TO RELEASE?</h2>
    <p>ANALÝZA TRACKU · LUFS · STEREO · ABLETON NÁVOD</p>
  </div>

  <div class="settings">
    <label>xAI API klíč (Grok) — zapamatuje se automaticky</label>
    <input type="password" id="apiKey" placeholder="xai-..." autocomplete="off">
    <label style="margin-top:12px">Model</label>
    <select id="model">
      <option value="grok-4-0709">grok-4 (doporučeno)</option>
      <option value="grok-3">grok-3</option>
      <option value="grok-2-1212">grok-2</option>
    </select>
  </div>

  <div class="upload-area" id="dropZone">
    <p style="font-size:40px;margin-bottom:10px">&#127911;</p>
    <strong style="font-size:18px">Přetáhni track sem</strong>
    <p>nebo klikni a vyber soubor (WAV, MP3, AIFF)</p>
    <input type="file" id="fileInput" accept="audio/*">
  </div>

  <div id="fileInfo" style="display:none;margin-bottom:16px;font-size:14px;color:#aaa"></div>

  <label style="font-size:13px;color:#888;margin-bottom:8px;display:block;letter-spacing:1px">POZNÁMKY (VOLITELNÉ)</label>
  <textarea id="notes" placeholder="např. melodic techno, 124 BPM, kick mi zaniká, stereo je moc široké..."></textarea>

  <div class="row">
    <button class="btn" id="analyzeBtn" disabled>ANALYZOVAT</button>
    <button class="btn" id="offlineBtn" style="background:#1a1a1a;border:1px solid #333">OFFLINE REŽIM</button>
  </div>

  <div class="cards" id="cards"></div>
  <div class="analysis" id="analysis"></div>
  <button class="copy-btn" id="copyBtn" style="display:none">KOPÍROVAT ROZBOR</button>
  <div class="status" id="status"></div>
</div>
<footer>TRACK LAB · GROK · JOSEMADEIRA</footer>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const analyzeBtn = document.getElementById('analyzeBtn');
const offlineBtn = document.getElementById('offlineBtn');
const notesEl = document.getElementById('notes');
const cardsEl = document.getElementById('cards');
const analysisEl = document.getElementById('analysis');
const statusEl = document.getElementById('status');
const fileInfoEl = document.getElementById('fileInfo');
const copyBtn = document.getElementById('copyBtn');
const apiKeyInput = document.getElementById('apiKey');
let currentFile = null;

// Load saved API key
if (localStorage.getItem('xai_key')) {
  apiKeyInput.value = localStorage.getItem('xai_key');
}
apiKeyInput.addEventListener('input', () => {
  localStorage.setItem('xai_key', apiKeyInput.value.trim());
});

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  currentFile = file;
  const size = (file.size / 1024 / 1024).toFixed(1);
  fileInfoEl.style.display = 'block';
  fileInfoEl.innerHTML = `<strong>${file.name}</strong> · ${size} MB · ${file.type || 'audio'}`;
  analyzeBtn.disabled = false;
  statusEl.textContent = '';
}

offlineBtn.addEventListener('click', () => {
  if (!currentFile) { statusEl.textContent = 'Nejdřív nahraj track.'; return; }
  const size = (currentFile.size / 1024 / 1024).toFixed(1);
  const ext = currentFile.name.split('.').pop().toUpperCase();
  cardsEl.innerHTML = `
    <div class="card"><div class="label">Soubor</div><div class="value">${ext}</div></div>
    <div class="card"><div class="label">Velikost</div><div class="value">${size} MB</div></div>
    <div class="card"><div class="label">Název</div><div class="value" style="font-size:14px">${currentFile.name.slice(0,18)}</div></div>
  `;
  analysisEl.innerHTML = `<h3>Offline režim</h3>Tady je základní info o souboru. Pro plnou analýzu vlož xAI API klíč nahoře a klikni na ANALYZOVAT.\n\nPoznámky: ${notesEl.value || '(prázdné)'}`;
  copyBtn.style.display = 'inline-block';
  statusEl.textContent = 'Offline režim — základní info';
});

analyzeBtn.addEventListener('click', async () => {
  const key = apiKeyInput.value.trim();
  if (!key) { statusEl.textContent = 'Vlož xAI API klíč pro plnou analýzu, nebo použij Offline režim.'; return; }
  if (!currentFile) return;

  analyzeBtn.disabled = true;
  statusEl.textContent = 'Analyzuji s Grokem... (může trvat 15–40 s)';
  cardsEl.innerHTML = '';
  analysisEl.innerHTML = '';

  const model = document.getElementById('model').value;
  const notes = notesEl.value.trim() || 'bez poznámek';

  const prompt = `Jsi senior mixing a mastering inženýr specializovaný na house / tech house / melodic techno. Analyzuj track na základě poznámek uživatele a vrať výstup ve formátu:\n\n1) Krátké karty hodnot (odhadni realisticky podle žánru a poznámek):\n- LUFS integrated\n- True peak\n- Stereo width (0-100%)\n- Dynamic range\n- Low end (20-80 Hz)\n- Kick presence\n- Vocal/clarity issues\n\n2) Detailní rozbor v češtině:\n- Co je dobře\n- Co je špatně a proč to vadí\n- Konkrétní opravy pro Ableton Live 12 (efekt, nastavení, hodnoty)\n- Jestli je track připravený na label nebo co ještě chybí\n- Detekce možných AI artefaktů (pokud něco naznačuje)\n\nPoznámky uživatele: ${notes}\nNázev souboru: ${currentFile.name}\n\nOdpověz česky, přímo, prakticky, bez obecných frází.`;

  try {
    const res = await fetch('https://api.x.ai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model: model,
        messages: [{ role: 'user', content: prompt }],
        max_tokens: 2000,
        temperature: 0.4
      })
    });

    const data = await res.json();
    const result = data.choices?.[0]?.message?.content || JSON.stringify(data);

    const lufs = result.match(/LUFS[^\d-]*(-?[\d.]+)/i);
    const peak = result.match(/true peak[^\d-]*(-?[\d.]+)/i) || result.match(/peak[^\d-]*(-?[\d.]+)/i);
    const stereo = result.match(/stereo[^\d]*([\d.]+)/i);
    const dyn = result.match(/dynamic[^\d]*([\d.]+)/i);

    cardsEl.innerHTML = `
      <div class="card"><div class="label">LUFS</div><div class="value ${lufs && parseFloat(lufs[1]) > -8 ? 'warn' : ''}">${lufs ? lufs[1] : '—'}</div></div>
      <div class="card"><div class="label">True Peak</div><div class="value ${peak && parseFloat(peak[1]) > -0.5 ? 'bad' : ''}">${peak ? peak[1] + ' dB' : '—'}</div></div>
      <div class="card"><div class="label">Stereo</div><div class="value">${stereo ? stereo[1] + '%' : '—'}</div></div>
      <div class="card"><div class="label">Dynamic</div><div class="value">${dyn ? dyn[1] + ' dB' : '—'}</div></div>
    `;

    analysisEl.innerHTML = '<h3>ROZBOR</h3>' + result.replace(/\n/g, '<br>');
    copyBtn.style.display = 'inline-block';
    statusEl.textContent = 'Hotovo';
  } catch (err) {
    analysisEl.innerHTML = '<h3>Chyba</h3>' + err.message + '\n\nZkontroluj xAI API klíč.';
    statusEl.textContent = 'Chyba při analýze';
  }
  analyzeBtn.disabled = false;
});

copyBtn.addEventListener('click', () => {
  const text = analysisEl.innerText;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = 'Zkopírováno';
    setTimeout(() => copyBtn.textContent = 'KOPÍROVAT ROZBOR', 1500);
  });
});
</script>
</body>
</html>
