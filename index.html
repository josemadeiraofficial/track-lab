<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Lab — JOSEMADEIRA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#e8e8e8;min-height:100vh}
  header{background:linear-gradient(90deg,#ff2d95 0%,#00e5ff 100%);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
  header h1{font-size:22px;font-weight:700;letter-spacing:2px;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.4)}
  .container{max-width:1100px;margin:0 auto;padding:28px 20px}
  .upload-area{border:2px dashed #ff2d95;border-radius:16px;padding:40px 20px;text-align:center;background:rgba(255,45,149,.04);margin-bottom:24px;transition:.3s}
  .upload-area.dragover{background:rgba(255,45,149,.12);border-color:#00e5ff}
  .upload-area p{color:#aaa;margin-top:8px;font-size:14px}
  input[type=file]{display:none}
  .btn{background:linear-gradient(90deg,#ff2d95,#00e5ff);border:none;color:#fff;padding:12px 28px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,45,149,.4)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  textarea{width:100%;min-height:110px;background:#141414;border:1px solid #2a2a2a;border-radius:12px;color:#eee;padding:14px;font-size:14px;resize:vertical;margin-bottom:16px;font-family:inherit}
  textarea:focus{outline:none;border-color:#00e5ff}
  .settings{background:#111;border:1px solid #222;border-radius:12px;padding:16px;margin-bottom:20px}
  .settings label{font-size:13px;color:#aaa;display:block;margin-bottom:6px}
  .settings input{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;color:#eee;padding:10px;font-size:13px}
  .settings input:focus{outline:none;border-color:#ff2d95}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px}
  .card{background:#111;border:1px solid #222;border-radius:14px;padding:16px;text-align:center}
  .card .label{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
  .card .value{font-size:22px;font-weight:700;color:#00e5ff}
  .card .value.warn{color:#ff9f43}
  .card .value.bad{color:#ff2d95}
  .analysis{background:#111;border:1px solid #222;border-radius:16px;padding:22px;white-space:pre-wrap;font-size:14.5px;line-height:1.7;min-height:200px}
  .analysis h3{color:#ff2d95;margin-bottom:12px;font-size:16px}
  .status{font-size:13px;color:#888;margin-top:12px;text-align:center}
  .row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .row .btn{flex:1;min-width:140px}
  footer{text-align:center;padding:30px;color:#555;font-size:12px}
  .copy-btn{background:#1a1a1a;border:1px solid #333;color:#aaa;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;margin-top:12px}
  .copy-btn:hover{color:#fff;border-color:#00e5ff}
</style>
</head>
<body>
<header>
  <h1>TRACK LAB</h1>
  <span style="font-size:13px;opacity:.8">JOSEMADEIRA · Grok</span>
</header>
<div class="container">
  <div class="settings">
    <label>xAI API klíč (Grok) — pro plnou AI analýzu</label>
    <input type="password" id="apiKey" placeholder="xai-..." autocomplete="off">
    <label style="margin-top:10px">Model</label>
    <select id="model" style="width:100%;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;color:#eee;padding:10px;font-size:13px">
      <option value="grok-4-0709">grok-4 (doporučeno)</option>
      <option value="grok-3">grok-3</option>
      <option value="grok-2-1212">grok-2</option>
    </select>
  </div>

  <div class="upload-area" id="dropZone">
    <p style="font-size:32px;margin-bottom:8px">&#127911;</p>
    <strong>Přetáhni track sem</strong>
    <p>nebo klikni a vyber soubor (WAV, MP3, AIFF)</p>
    <input type="file" id="fileInput" accept="audio/*">
  </div>

  <div id="fileInfo" style="display:none;margin-bottom:16px;font-size:14px;color:#aaa"></div>

  <label style="font-size:13px;color:#888;margin-bottom:6px;display:block">Poznámky (volitelné) — žánr, reference, tempo, co je špatně</label>
  <textarea id="notes" placeholder="např. melodic techno, 124 BPM, kick mi zaniká, stereo je moc široké..."></textarea>

  <div class="row">
    <button class="btn" id="analyzeBtn" disabled>ANALYZOVAT</button>
    <button class="btn" id="offlineBtn" style="background:#1a1a1a;border:1px solid #333">Offline režim</button>
  </div>

  <div class="cards" id="cards"></div>
  <div class="analysis" id="analysis"></div>
  <button class="copy-btn" id="copyBtn" style="display:none">Kopírovat rozbor</button>
  <div class="status" id="status"></div>
</div>
<footer>Track Lab · Grok · JOSEMADEIRA</footer>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const analyzeBtn = document.getElementById('analyzeBtn');
const offlineBtn = document.getElementById('offlineBtn');
const notesEl = document.getElementById('notes');
const cardsEl = document.getElementById('cards');
const analysisEl = document.getElementById('analysis');
const statusEl = document.getElementById('status');
const fileInfoEl = document.getElementById('fileInfo');
const copyBtn = document.getElementById('copyBtn');
let currentFile = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  currentFile = file;
  const size = (file.size / 1024 / 1024).toFixed(1);
  fileInfoEl.style.display = 'block';
  fileInfoEl.innerHTML = `<strong>${file.name}</strong> · ${size} MB · ${file.type || 'audio'}`;
  analyzeBtn.disabled = false;
  statusEl.textContent = '';
}

offlineBtn.addEventListener('click', () => {
  if (!currentFile) { statusEl.textContent = 'Nejdřív nahraj track.'; return; }
  const size = (currentFile.size / 1024 / 1024).toFixed(1);
  const ext = currentFile.name.split('.').pop().toUpperCase();
  cardsEl.innerHTML = `
    <div class="card"><div class="label">Soubor</div><div class="value">${ext}</div></div>
    <div class="card"><div class="label">Velikost</div><div class="value">${size} MB</div></div>
    <div class="card"><div class="label">Název</div><div class="value" style="font-size:14px">${currentFile.name.slice(0,18)}</div></div>
  `;
  analysisEl.innerHTML = `<h3>Offline režim</h3>Tady je základní info o souboru. Pro plnou analýzu vlož xAI API klíč nahoře a klikni na ANALYZOVAT.\n\nPoznámky: ${notesEl.value || '(prázdné)'}`;
  copyBtn.style.display = 'inline-block';
  statusEl.textContent = 'Offline režim — základní info';
});

analyzeBtn.addEventListener('click', async () => {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { statusEl.textContent = 'Vlož xAI API klíč pro plnou analýzu, nebo použij Offline režim.'; return; }
  if (!currentFile) return;

  analyzeBtn.disabled = true;
  statusEl.textContent = 'Analyzuji s Grokem... (může trvat 15–40 s)';
  cardsEl.innerHTML = '';
  analysisEl.innerHTML = '';

  const model = document.getElementById('model').value;
  const notes = notesEl.value.trim() || 'bez poznámek';

  const prompt = `Jsi senior mixing a mastering inženýr specializovaný na house / tech house / melodic techno. Analyzuj track na základě poznámek uživatele a vrať výstup ve formátu:\n\n1) Krátké karty hodnot (odhadni realisticky podle žánru a poznámek):\n- LUFS integrated\n- True peak\n- Stereo width (0-100%)\n- Dynamic range\n- Low end (20-80 Hz)\n- Kick presence\n- Vocal/clarity issues\n\n2) Detailní rozbor v češtině:\n- Co je dobře\n- Co je špatně a proč to vadí\n- Konkrétní opravy pro Ableton Live 12 (efekt, nastavení, hodnoty)\n- Jestli je track připravený na label nebo co ještě chybí\n- Detekce možných AI artefaktů (pokud něco naznačuje)\n\nPoznámky uživatele: ${notes}\nNázev souboru: ${currentFile.name}\n\nOdpověz česky, přímo, prakticky, bez obecných frází.`;

  try {
    const res = await fetch('https://api.x.ai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model: model,
        messages: [{ role: 'user', content: prompt }],
        max_tokens: 2000,
        temperature: 0.4
      })
    });

    const data = await res.json();
    const result = data.choices?.[0]?.message?.content || JSON.stringify(data);

    const lufs = result.match(/LUFS[^\d-]*(-?[\d.]+)/i);
    const peak = result.match(/true peak[^\d-]*(-?[\d.]+)/i) || result.match(/peak[^\d-]*(-?[\d.]+)/i);
    const stereo = result.match(/stereo[^\d]*([\d.]+)/i);
    const dyn = result.match(/dynamic[^\d]*([\d.]+)/i);

    cardsEl.innerHTML = `
      <div class="card"><div class="label">LUFS</div><div class="value ${lufs && parseFloat(lufs[1]) > -8 ? 'warn' : ''}">${lufs ? lufs[1] : '—'}</div></div>
      <div class="card"><div class="label">True Peak</div><div class="value ${peak && parseFloat(peak[1]) > -0.5 ? 'bad' : ''}">${peak ? peak[1] + ' dB' : '—'}</div></div>
      <div class="card"><div class="label">Stereo</div><div class="value">${stereo ? stereo[1] + '%' : '—'}</div></div>
      <div class="card"><div class="label">Dynamic</div><div class="value">${dyn ? dyn[1] + ' dB' : '—'}</div></div>
    `;

    analysisEl.innerHTML = '<h3>Rozbor (Grok)</h3>' + result.replace(/\n/g, '<br>');
    copyBtn.style.display = 'inline-block';
    statusEl.textContent = 'Hotovo';
  } catch (err) {
    analysisEl.innerHTML = '<h3>Chyba</h3>' + err.message + '\n\nZkontroluj xAI API klíč.';
    statusEl.textContent = 'Chyba při analýze';
  }
  analyzeBtn.disabled = false;
});

copyBtn.addEventListener('click', () => {
  const text = analysisEl.innerText;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = 'Zkopírováno';
    setTimeout(() => copyBtn.textContent = 'Kopírovat rozbor', 1500);
  });
});
</script>
</body>
</html>
